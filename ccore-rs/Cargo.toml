[package]
name = "ccore"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
poise = "0.7.1"
json_comments = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
